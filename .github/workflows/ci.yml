name: ci

# Lint + tests on every push and pull request. Fast: the tests never load the
# voice model, so torch/PortAudio aren't installed here (see requirements-dev.txt).
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
